[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "respondoia"
version = "0.1.0.dev0"
description = "Reply suggestions in your own writing style. Works with WhatsApp Desktop on Windows."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Bryan Munaretto Zauza" }]
dependencies = [
    "PySide6>=6.7",
    "pywin32>=306",
    "pydantic>=2",
    "anthropic>=2",
    "keyring>=24",
    "tomli-w>=1.0",
    "Pillow>=10",
    "comtypes>=1.4",
    "sqlcipher3-wheels==0.5.7",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.6"]

[project.gui-scripts]
respondoia = "respondoia.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/respondoia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
qt_api = "pyside6"
addopts = "-m 'not live and not desktop'"
markers = [
    "live: calls the real model API and costs money",
    "desktop: touches the real clipboard or windows",
]

[tool.ruff]
line-length = 100
target-version = "py312"
